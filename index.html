<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>spend wise</title>
  </head>
  <body>
    <h1 id="heading1">My Budget Tracker</h1>
    <h2 id="subheading1">Track your income and expenses in one place</h2>

    <section class="add-expense">
      <fieldset class="details">
        <legend>Add Expense</legend>

        <label for="expense_name">the expenses name:</label>
        <input type="text" id="expense_name" name="expense_name" />

        <label for="amount">the amount:</label>
        <input type="amount" id="amount" name="amount" />

        <label for="category">the category</label>
        <input type="category" id="category" name="category" />
      </fieldset>
    </section>

    <section class="display-expense">
      <h1 id="heading2">Your Expenses</h1>
      <p id="subheading2">No expenses yet</p>
    </section>
  </body>
</html>
